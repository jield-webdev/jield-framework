name: Composer checks and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, fileinfo, gd, gmp, igbinary, intl, mbstring, pdo_sqlite, redis, xml, xmlreader, xmlwriter, xsl, zip, zlib
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check the package
        run: composer release:check
      - name: Test the distribution in a consuming application
        run: composer test:consumer
      - name: Verify checks leave tracked files unchanged
        run: git diff --exit-code

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          number='(0|[1-9][0-9]*)'
          prerelease="^v0\.${number}\.${number}-(alpha|beta|RC)\.[1-9][0-9]*$"
          stable="^v[1-9][0-9]*\.${number}\.${number}$"
          flags=()
          if [[ "$RELEASE_TAG" =~ $prerelease ]]; then
            flags+=(--prerelease --latest=false)
          elif [[ ! "$RELEASE_TAG" =~ $stable ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          php bin/release.php "$version" --verify-tag
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$version]" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > "$notes"
          test -s "$notes"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$notes" "${flags[@]}"

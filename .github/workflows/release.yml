name: CI and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up project dependencies
        id: dependencies
        uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
      - name: Build PDF fonts
        id: fonts
        run: composer pdf-fonts
      - name: Check PHP syntax
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: composer php-lint
      - name: Run PHPUnit
        if: ${{ !cancelled() && steps.fonts.outcome == 'success' }}
        run: composer test
      - name: Test the distribution in a consuming application
        if: ${{ !cancelled() && steps.fonts.outcome == 'success' }}
        run: composer test:consumer
      - name: Verify checks leave tracked files unchanged
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: git diff --exit-code

  quality:
    name: PHP code quality and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up project dependencies
        id: dependencies
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.4'
      - name: Validate Composer metadata and lock file
        run: composer package:validate
      - name: Run PHPStan
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: composer phpstan -- --no-progress --error-format=github
      - name: Check source coding standards
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: composer cs
      - name: Check test coding standards
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: composer cs-test
      - name: Audit locked dependencies
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: composer security:check
      - name: Verify checks leave tracked files unchanged
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: git diff --exit-code

  mago:
    name: Mago
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up project dependencies
        id: dependencies
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.4'
      - name: Set up Mago
        id: mago
        uses: nhedger/setup-mago@v2
        with:
          version: '1.59.0'
      - name: Check formatting
        run: composer mago:format
      - name: Run Mago lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.mago.outcome == 'success' }}
        run: composer mago:lint -- --reporting-format=github
      - name: Run Mago analysis
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.mago.outcome == 'success' }}
        run: composer mago:analyze -- --reporting-format=github

  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows and shell scripts
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  ci:
    name: CI
    if: ${{ always() }}
    needs: [check, quality, mago, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          PHP_CHECKS: ${{ needs.check.result }}
          QUALITY_CHECKS: ${{ needs.quality.result }}
          MAGO_CHECKS: ${{ needs.mago.result }}
          WORKFLOW_CHECKS: ${{ needs.workflow-lint.result }}
        run: |
          test "$PHP_CHECKS" = success
          test "$QUALITY_CHECKS" = success
          test "$MAGO_CHECKS" = success
          test "$WORKFLOW_CHECKS" = success

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          number='(0|[1-9][0-9]*)'
          prerelease="^v0\.${number}\.${number}-(alpha|beta|RC)\.[1-9][0-9]*$"
          stable="^v[1-9][0-9]*\.${number}\.${number}$"
          flags=()
          if [[ "$RELEASE_TAG" =~ $prerelease ]]; then
            flags+=(--prerelease --latest=false)
          elif [[ ! "$RELEASE_TAG" =~ $stable ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          php bin/release.php "$version" --verify-tag
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$version]" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > "$notes"
          test -s "$notes"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$notes" "${flags[@]}"
